spring.application.name=QuiteSpotFinder
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]


spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=gemma4:e4b
spring.ai.ollama.chat.options.num-predict=4096
spring.ai.ollama.chat.options.num-ctx=32768


mapbox.access-token=${MAPBOX_ACCESSTOKEN}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8443,http://127.0.0.1:8443,http://localhost:5173}

spring.jackson.deserialization.fail-on-unknown-properties=false

spring.devtools.restart.exclude=data/**,**/data/**

spring.http.clients.read-timeout=120s
spring.http.clients.connect-timeout=60s





